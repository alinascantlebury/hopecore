<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vine and Videos</title>
  <link rel="stylesheet" href="styles.css" />

</head>

<body>

  <div >
    <h1 >pick a leaf</h1>
    <div class="subtitle" id="subtitle">don’t choose wisely.</div>
  </div>

  <main>
    <div id="video-gallery" class="video-gallery"></div>
  </main>

  <div class="vine-wrapper">
    <img src="./images/v.png" alt="vine" class="vine-img" />

    <div class="leaf" id="leaf1" data-video="./class/stream.html"></div>
    <div class="leaf" id="leaf2" data-video="./doom/doomed.html"></div>
    <div class="leaf" id="leaf3" data-video="./look/looking.html"></div>
    <div class="leaf" id="leaf4" data-video="./me/index.html"></div>
    <div class="leaf" id="leaf5" data-video="./you/index.html"></div>
    <div class="leaf" id="leaf6" data-video="./leaves/index.html"></div>
    <div class="leaf" id="leaf7" data-video="./meditate/list.html"></div>
    <div class="leaf" id="leaf8" data-video="./doom/beech.html"></div>
    <div class="leaf" id="leaf9" data-video="./you/index.html"></div>
    <div class="leaf" id="leaf10" data-video="./doom/doomed.html"></div>
    <div class="leaf" id="leaf11" data-video="./me/index.html"></div>
    <div class="leaf" id="leaf12" data-video="./videos/twelve.MP4"></div>
    <div class="leaf" id="leaf13" data-video="./videos/thirteen.MP4"></div>
    <div class="leaf" id="leaf14" data-video="./class/stream.html"></div>
    <div class="leaf" id="leaf15" data-video="./doom/beech.html"></div>
    <div class="leaf" id="leaf16" data-video="./bye/index.html"></div>
    <div class="leaf" id="leaf17" data-video="./dao/index.html"></div>
  </div>

  <script>
const leaves = document.querySelectorAll('.leaf');
leaves.forEach(leaf => {
  leaf.addEventListener('click', () => {
    const dataSrc = leaf.getAttribute('data-video');
    const audioSrc = leaf.getAttribute('data-audio');
    
    if (dataSrc.toLowerCase().endsWith('.mp4')) {
      let url = `vid.html?video=${encodeURIComponent(dataSrc)}`;
      if (audioSrc) {
        url += `&audio=${encodeURIComponent(audioSrc)}`;
      }
      window.location.href = url;
    } else {
      window.location.href = dataSrc;
    }
  });
});

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('subtitle').classList.add('visible');
      }, 500);
    });
  </script>
</body>
</html>
