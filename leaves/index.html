<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>digital resting point</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Welcome image -->
  <div class="welcome-image">
    <img src="../images/congrats.png" alt="digital resting point" />
  </div>

  <!-- Atmospheric layers -->
  <div id="fog"></div>
  <div id="fireflies-container"></div>
  <div class="vignette"></div>

  <!-- Scroll hint -->
  <div class="scroll-hint">descend</div>

  <!-- Initial spacer -->
  <div class="scroll-spacer"></div>

  <!-- Orb navigation area -->
  <!-- <div class="orb-scroll-area"> -->
  
    <a href="../meditate/list.html" class="orb orb1"></a>
    <a href="../doom/doomed.html" class="orb orb2"></a>
    <a href="../look/looking.html" class="orb orb3"></a>
    <a href="../class/stream.html" class="orb orb4"></a>
    <a href="../leaves/index.html" class="orb orb5"></a>
    <a href="../you/index.html" class="orb orb6"></a>
    <a href="../leaves/index.html" class="orb orb7"></a>
    <a href="../leaves/index.html" class="orb orb8"></a>
  
  <!-- </div>-->

  <script>
    // Firefly generation with natural variation
    const container = document.getElementById("fireflies-container");
    const fireflyCount = 28;
    
    for (let i = 0; i < fireflyCount; i++) {
      const fly = document.createElement("div");
      fly.className = "firefly";
      
      // Random positioning
      fly.style.top = `${Math.random() * 120}vh`;
      fly.style.left = `${Math.random() * 100}vw`;
      
      // Natural movement variations
      const driftX = (Math.random() - 0.5) * 200;
      const driftY = -80 - Math.random() * 120;
      fly.style.setProperty("--dx", `${driftX}px`);
      fly.style.setProperty("--dy", `${driftY}px`);
      
      // Staggered animation delays
      fly.style.setProperty("--delay", `${Math.random() * 4}s`);
      
      container.appendChild(fly);
    }

    // Orb reveal on scroll with smooth stagger
    const orbs = document.querySelectorAll('.orb');
    const scrollHint = document.querySelector('.scroll-hint');
    
    function updateOrbs() {
      const scrollY = window.scrollY;
      const windowHeight = window.innerHeight;
      
      // Hide scroll hint after initial scroll
      if (scrollY > windowHeight * 0.3) {
        scrollHint.style.opacity = '0';
      } else {
        scrollHint.style.opacity = '';
      }
      
      // Reveal orbs progressively
      orbs.forEach((orb, index) => {
        const orbTop = orb.offsetTop + orb.offsetParent.offsetTop;
        const triggerPoint = scrollY + windowHeight * 0.75;
        
        if (triggerPoint > orbTop) {
          setTimeout(() => {
            orb.classList.add('visible');
          }, index * 80); // Gentle stagger
        } else {
          orb.classList.remove('visible');
        }
      });
    }
    
    // Smooth scroll handling with throttle
    let scrollTimeout;
    window.addEventListener('scroll', () => {
      if (scrollTimeout) {
        window.cancelAnimationFrame(scrollTimeout);
      }
      scrollTimeout = window.requestAnimationFrame(updateOrbs);
    });
    
    // Initial check
    updateOrbs();
  </script>
</body>
